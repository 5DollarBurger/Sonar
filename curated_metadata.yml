tables:
      - name: platform_orders
        create_shared_view: true
        filter_by_country: false
        filter_by_entity: true
        entity_id_column: global_entity_id
        is_view: true
        authorise_view:
          dataset_id: dm_fintech
        columns:
          - region
          - country_name
          - global_entity_id
          - order_id
          - is_parent_order
          - parent_order_id
          - customer_code
          - order_datetime
          - order_date
          - payment_status
          - payment_status_grouped
          - payment_status_category
          - payment_type
          - payment_method
          - payment_method_detailed
          - is_mixed_payment
          - vertical
          - amt_gmv_lc
          - local_currency
          - amt_gmv_eur
          - order_device
          - app_version
          - vendor_id
          - vendor_city
          - order_status
          - decline_reason
          - is_vendor_accepted
          - delivery_type
          - is_delivered
          - is_processed
          - is_async_payment_mode
          - is_checkout_api
          - data_source
          - is_first_attempt
          - is_last_attempt
          - attempts_count
          - is_voucher_used
          - voucher_code
          - final_amount
          - initial_amount_accounting
          - final_amount_accounting
          - initial_amount
          - is_billable
          - parent_order_first_payment_type
          - parent_order_last_payment_type
          - parent_order_payment_method
          - parent_order_last_payment_method
          - parent_order_acceptance_status
          - parent_order_acceptance_status_detailed
          - transaction_id
          - routing_condition
          - mixed_payment_details
          - is_parent_attempt
          - payment_attempt_id
          - purchase_id
        columns_description:
          - amt_gmv_eur: "GMV amount in euros"
          - amt_gmv_lc: "GMV amount in local currency"
          - app_version: "App version number"
          - attempts_count: "Number of order attempts - only available for parent order id"
          - country_name: "Country of the order"
          - customer_code: "Unique identifier of the customer"
          - data_source: "Data source where we source the data"
          - decline_reason: "Backend decline reason"
          - delivery_type: "Delivery type. Eg: OWN_DELIVERY, PICKUP, VENDOR_DELIVERY"
          - final_amount: "Final local amount of the order"
          - final_amount_accounting: "Final amount accounting for the order"
          - global_entity_id: "Identifier of the global entity/brand"
          - initial_amount: "Initial local amount of the order"
          - initial_amount_accounting: "Initial amount accounting for the order"
          - is_async_payment_mode: "Boolean if payment mode is_async"
          - is_billable: "Flag that is 'true' if the order is payable to vendor"
          - is_checkout_api: "Boolean to identify if checkout API or HPP"
          - is_delivered: "If the order was delivered"
          - is_first_attempt: "Boolean to identify if first order"
          - is_last_attempt: "Boolean to identify if last order"
          - is_mixed_payment: "Indicating whether the purchase was using combination of payment methods. Such as gift_cards, wallet, etc"
          - is_parent_order: "boolean flag if the respective order is a parent order i.e. the latest attempt based on the criteria among the orders with the same GMV amount from the same entity, same vendor/restaurant, same customer given on the same day"
          - is_processed: "If the order was processed"
          - is_vendor_accepted: "Boolean to identify if it was accepted by vendor"
          - is_voucher_used: "Boolean to identify if voucher was applied"
          - local_currency: "Local currency code"
          - order_date: "UTC date indicating when the order was generated"
          - order_datetime: "UTC datetime indicating when the order was generated"
          - order_device: "Backend device information"
          - order_id: "unique identifier of the order"
          - order_status: "Backend order status"
          - parent_order_acceptance_status: "The aggregate status of purchase from overall order attempts"
          - parent_order_acceptance_status_detailed: "The aggregate detailed status of purchase from overall order attempts"
          - parent_order_first_payment_type: "Payment Type on the first attempt of purchase"
          - parent_order_id: "ID indicates of intended customer purchase based on same date, basket amount and same amount"
          - parent_order_last_payment_method: "Payment Method on the last attempt of purchase"
          - parent_order_last_payment_type: "Last payment type from parent order"
          - parent_order_payment_method: "Payment Method on the first attempt of purchase"
          - payment_method: "Backend payment method"
          - payment_method_detailed: "Backend payment method detailed"
          - payment_status: "Payment status as appear in backend"
          - payment_status_category: "Payment status categorised in success or fail"
          - payment_status_grouped: "Payment status grouped between success vs others non-successful statuses"
          - payment_type: "Backend payment type"
          - region: "Region of the order"
          - vendor_city: "City in which the vendor is located"
          - vendor_id: "Unique identifier for the vendor/restaurant"
          - vertical: "Vertical information of the vendor/restaurant"
          - voucher_code: "Unique identifier for voucher"
          - transaction_id: "Order number, indicates the id of each transactions of order"
          - is_parent_attempt: "Boolean to identify if the order is parent attempt"
          - payment_attempt_id: "Unique identifier for each attempt of the order"
          - purchase_id: "Unique identifier for each purchase of the order"
        table_description: "Contains information for Pandora, Talabat, Zomato, Instashop and PedidosYa in an order level."

