        columns_description:
          - region: "Region of payment when it's taken place"
          - country: "Country of payment when it's taken place"
          - global_entity_id: "Identifier of the global entity/brand"
          - customer_code: "Unique identifier of the customer"
          - order_date: "UTC date indicating when the order was generated"
          - order_datetime: "UTC datetime indicating when the order was generated"
          - order_id: "Unique identifier of the order"
          - parent_order_id: "ID indicates intended customer purchase based on the same date, basket amount, and same amount"
          - acceptance_status: "The aggregate status of purchase from overall order attempts"
          - acceptance_status_detailed: "The aggregate detailed status of purchase from overall order attempts"
          - order_attempts: "Number of order attempts - only available for parent order id"
          - order_gmv_eur: "GMV amount in euros"
          - vertical: "Vertical information of the vendor/restaurant"
          - order_device: "Backend device information"
          - first_payment_type: "Payment Type on the first attempt of purchase"
          - first_payment_method: "Payment Method on the first attempt of purchase"
          - first_payment_status: "First attempt payment status as appears in the backend"
          - first_payment_status_grouped: "First attempt payment status grouped between success vs others non-successful statuses"
          - first_payment_status_category: "First attempt payment status categorized as success or fail"
          - is_alfred: "Indicates whether the order took place through Alfred"
          - is_psp: "Indicates whether we have PSP data on this payment attempt"
          - psp: "Name of Payment Service Provider data source"
          - psp_acquirer: "Name of the acquirer that processed the original payment"
          - psp_merchant_account: "Name of the merchant account used to process the original payment request"
          - psp_payment_method: "Name of the payment method which was processed"
          - psp_payment_method_detailed: "Detailed payment method name if available"
          - psp_authorization_type: "Transaction type, whether a recurring (saved) payment method is used"
          - psp_authorization_status: "Authorization status of each transaction"
          - psp_operation_status: "Normalized operation status based on PSP's acquirer raw response"
          - psp_actionability: "Indicator whether the decline shown in psp_operation_status is actionable"
          - psp_acquirer_response: "Normalized response from the acquirer (not necessarily the final status of the payment)"
          - last_payment_type: "Payment Type on the last attempt of purchase"
          - last_payment_method: "Payment Method on the last attempt of purchase"
          - last_payment_status: "Last attempt payment status as appears in backend"
          - last_payment_status_grouped: "Last attempt payment status grouped between success vs others non-successful statuses"
          - last_payment_status_category: "Last attempt payment status categorized as success or fail"
          - is_async_payment_mode: "Indicator whether the payment was going through async payment mode (only available for Pandora)"
          - is_mixed_payment: "Indicating whether the purchase was using a combination of payment methods, such as gift cards, wallet, etc."
          - app_version: "App version when the order took place"
          - is_cyprus: "Indicating whether the purchase was a Cyprus purchase"
          - data_source: "Data source where we source the data"
          - alfred_gateway_id: "Type of gateway that Alfred uses on this payment attempt"
          - gateway_version: "Version of gateway ID that Alfred uses on this payment attempt"
          - payment_instrument_status: "The status of the instrument used for payment attempt"
          - routing_condition: "Describes the condition of routing during the payment attempt"
          - payment_service: "Indicator whether the attempt was going through Payment Central's revamp"
          - parent_order_payment_service: "Indicator whether the grouped order was going through Payment Central's revamp"
          - revamp_error_message: "Error message returned when the attempt was using Payments Central revamp"
          - revamp_operation_status: "Operation status returned from Payments Central revamp"
          - antifraud_decision: "The decision returned from Antifraud to check fraudulent transactions"
          - is_parent_order: "Boolean flag if the respective order is a parent order i.e. the latest attempt based on the criteria among the orders with the same GMV amount from the same entity, same vendor/restaurant, same customer given on the same day"
          - order_gmv_lc: "GMV amount in local currency"
          - parent_routing_condition: "Identify the routing condition/identifiers for parent_order id in alfred/revamp"
          - payment_method: "Backend payment method"
          - payment_method_detailed: "Backend payment method detailed"
          - payment_status_category: "Payment status categorised in success or fail on this attempt"
          - shadow_mode: "Defining testing mode of revamp"
          - vendor_id: "Unique identifier for the vendor/restaurant"
          - alfred_error_message: "Error message returned when the attempt was using Alfred"
          - alf_rev_auth_status: "This field contains the authorisation status from revamp and alfred"
          - alf_rev_latency: "This field contains the latency in ms calculated from the state when the order created until the authorization process completed. Either in revamp and alfred"
        table_description: "Contains information for Pandora, Talabat, Hungerstation, Glovo and PedidosYa in an order level, with additional data from PSPs and Alfred"